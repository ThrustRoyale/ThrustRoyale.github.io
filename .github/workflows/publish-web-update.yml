name: Publish web update
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New game version, e.g. 1.0.3 (must match GAME_VER in Royale.html)"
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version matches the game file
        run: grep -q "var GAME_VER='$V'" Royale.html
      - name: Build the update zip
        run: |
          python3 prepare_www.py
          mkdir -p updates
          (cd www && zip -r "../updates/web-$V.zip" .)
          ls -1t updates/*.zip | tail -n +4 | xargs -r rm -f
      - name: Point version.json at it
        run: |
          SIZE=$(stat -c%s "updates/web-$V.zip")
          printf '{"version":"%s","size":%s,"url":"https://thrustroyale.github.io/updates/web-%s.zip"}\n' "$V" "$SIZE" "$V" > version.json
          git config user.name github-actions
          git config user.email actions@github.com
          git add updates version.json
          git commit -m "Web update $V"
          git push
          
